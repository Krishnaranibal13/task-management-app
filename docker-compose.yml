# Task Management MVP — local development stack
#
# Same-origin topology note: in production the approved architecture
# prefers serving frontend and API from one origin behind a reverse proxy.
# This compose file is for LOCAL development only (separate ports).
#
# Secrets: NO passwords are hard-coded here. All credentials are supplied
# through environment-variable substitution from the repository-root
# `.env` file. Copy `.env.example` to `.env` and adjust — never commit
# real secrets. The `:-default` fallbacks below are local-only
# placeholders so `docker compose config` works on a fresh checkout.

services:
  db:
    image: mysql:8.4
    container_name: taskmgmt-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-taskdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      # Local development only: published ports bind to localhost
      # explicitly. Host-side port is overridable (a native MySQL may
      # already occupy 3306 on some dev machines). In-network access
      # stays db:3306.
      - "127.0.0.1:${MYSQL_HOST_PORT:-33061}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Optional init scripts run once on first startup:
      - ./infrastructure/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Password is passed via reference to the container's own env var;
      # it is not duplicated as a literal in this file.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: taskmgmt-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      MYSQL_HOST: db                 # inside the compose network
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-taskdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      # LOCAL/TEST-ONLY value so the dev container can create sessions.
      # Production lifetimes are deployment decisions, never code defaults.
      SESSION_LIFETIME_SECONDS: "3600"
      # Explicit trusted-origin allowlist (Phase 5A: browser SPA on :3000
      # calls this API cross-origin in local development). Credentialed
      # wildcard remains prohibited by app startup validation.
      CORS_ALLOWED_ORIGINS_RAW: "${CORS_ALLOWED_ORIGINS_RAW:-http://localhost:3000,http://127.0.0.1:3000}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: taskmgmt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Hot reload for local development.
      - ./frontend/app:/app/app
      - ./frontend/public:/app/public

volumes:
  db_data:

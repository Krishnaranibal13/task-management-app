services:

  db:
    image: mysql:8.4
    container_name: taskmgmt-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DB:-taskdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

    volumes:
      - db_data:/var/lib/mysql
      - ./infrastructure/mysql/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 3s
      retries: 20


  backend:
    build: ./backend
    container_name: taskmgmt-backend
    restart: unless-stopped

    environment:
      ENVIRONMENT: development

      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-taskdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      SESSION_LIFETIME_SECONDS: "3600"

      CORS_ALLOWED_ORIGINS_RAW: "${CORS_ALLOWED_ORIGINS_RAW:-http://3.95.199.5}"

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"


  frontend:
    build: ./frontend
    container_name: taskmgmt-frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_BASE_URL: /api

    depends_on:
      - backend


  nginx:
    image: nginx:alpine
    container_name: taskmgmt-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend


volumes:
  db_data:
